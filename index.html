<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Correção de simulados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--surf:#fff;--ink:#14282b;--mute:#5b6f72;--line:#d3dedc;--brand:#0e5a5f;--onbrand:#fff;--ok:#16794a;--bad:#b3261e;--warn:#b86e00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1d;--surf:#17282b;--ink:#e6efee;--mute:#9bb0b2;--line:#2c4245;--brand:#5cc2c7;--onbrand:#08262a;--ok:#6fd49c;--bad:#ff9a92;--warn:#ffc15c}}
:root[data-theme="dark"]{--bg:#0f1b1d;--surf:#17282b;--ink:#e6efee;--mute:#9bb0b2;--line:#2c4245;--brand:#5cc2c7;--onbrand:#08262a;--ok:#6fd49c;--bad:#ff9a92;--warn:#ffc15c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.35rem;margin:6px 0 2px}
p.sub{margin:0 0 14px;color:var(--mute)}
button,input{font:inherit;color:inherit}
.gate{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:24px}
.gate label.l{display:block;font-weight:700;margin-bottom:8px}
.gate input[type=password]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rem{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--mute)}
.btn{background:var(--brand);color:var(--onbrand);border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;color:var(--onbrand);border:1.5px solid var(--onbrand);margin-top:0;padding:9px 12px}
.err{color:var(--bad);margin:10px 0 0;min-height:1.4em}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border:1.5px solid var(--line);background:var(--surf);border-radius:8px;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--onbrand);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.score b{font-size:2rem;line-height:1}
.score small{display:block;opacity:.92}
.scan{display:block;text-align:center;background:var(--surf);border:2px dashed var(--brand);color:var(--brand);border-radius:12px;padding:18px;font-weight:700;font-size:1.15rem;cursor:pointer;margin-bottom:10px}
.scan:focus-within{outline:3px solid var(--brand);outline-offset:2px}
.scan small{display:block;font-weight:400;color:var(--mute);font-size:.9rem;margin-top:2px}
#cam{position:absolute;opacity:0;width:1px;height:1px}
#msg{margin:0 0 10px;min-height:1.4em}
#msg.bad{color:var(--bad);font-weight:700}
#msg.warn{color:var(--warn);font-weight:700}
#prev{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
details{margin-bottom:12px}
summary{cursor:pointer;font-weight:700;padding:10px 4px}
.quick{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.quick input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);letter-spacing:.12em;text-transform:uppercase}
.quick small{color:var(--mute)}
.q{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surf)}
.q:first-child{border-radius:10px 10px 0 0}.q:last-child{border-radius:0 0 10px 10px;border-bottom:0}
.q.chk{box-shadow:inset 5px 0 0 var(--warn)}
.q .n{width:2.1em;font-weight:700;text-align:right}
.q .opts{display:flex;gap:6px;flex:1}
.opt{flex:1;min-width:0;height:42px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;font-weight:700;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--onbrand)}
.q.ok .opt[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surf)}
.q.no .opt[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surf)}
.q .res{width:3.9em;text-align:right;font-size:.85rem;font-weight:700}
.q.ok .res{color:var(--ok)}.q.no .res{color:var(--bad)}.q.chk .res{color:var(--warn)}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cell{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.cell span{display:block;color:var(--mute);font-size:.85rem}
.cell b{font-size:1.6rem;color:var(--brand)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:8px}.pk{padding:18px 8px;border:1.5px solid var(--brand);background:var(--surf);color:var(--brand);border-radius:10px;font-weight:700;font-size:1.05rem;cursor:pointer}.dh{font-weight:700;margin:16px 0 8px;color:var(--ink)}.dh small{display:block;font-weight:400;color:var(--mute)}.who{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.who button{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:4px}
.out{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;margin-top:18px;padding:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1 id="ttl">Correção de simulados</h1>
<p class="sub">Correção pelo cartão-resposta</p>

<section class="gate" id="gate">
  <label class="l" for="pw">Senha do professor</label>
  <input id="pw" type="password" autocomplete="current-password">
  <label class="rem"><input type="checkbox" id="rem" checked> Lembrar a senha neste aparelho</label>
  <p class="err" id="err" role="alert"></p>
  <button class="btn" id="enter">Entrar</button>
</section>

<section id="pick" hidden>
  <div id="picks"></div>
  <button class="out" id="out2">Sair e esquecer a senha neste aparelho</button>
</section>

<section id="app" hidden>
  <div class="who"><span id="who"></span><button id="swap">Trocar turma</button></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="t1" aria-selected="true">Corrigir cartão</button>
    <button role="tab" id="t2" aria-selected="false">Gabarito</button>
  </div>

  <div id="p1">
    <div class="score" aria-live="polite">
      <div><b id="hits">0</b> <span>de <span id="tot">30</span> acertos</span><small id="info">Nenhum cartão lido</small></div>
      <button class="btn ghost" id="clear">Próximo aluno</button>
    </div>
    <label class="scan" for="cam">Fotografar o cartão<small>Enquadre a folha inteira, com os 4 quadrados pretos visíveis</small></label>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <p id="msg" role="status"></p>
    <canvas id="prev" hidden></canvas>
    <details id="chk">
      <summary>Conferir ou corrigir as respostas lidas</summary>
      <div class="quick">
        <label for="seq"><b>Digitar todas as respostas de uma vez</b></label>
        <input id="seq" placeholder="BCBDAC…" autocapitalize="characters" autocomplete="off">
        <small>Use um ponto (.) para questão em branco.</small>
      </div>
      <div class="list" id="rows"></div>
    </details>
  </div>

  <div id="p2" hidden><div class="grid" id="key"></div></div>
  <button class="out" id="out">Sair e esquecer a senha neste aparelho</button>
</section>
</main>

async function unlock(silent){
  $("err").textContent="";
  const pw=$("pw").value;if(!pw)return;
  try{
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(BLOB.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);

    DATA=JSON.parse(new TextDecoder().decode(pt));
    if($("rem").checked)LS.set("pwsim",pw);
    $("gate").hidden=true;start();
  }catch(e){
    LS.del("pwsim");
    if(!silent)$("err").textContent="Senha incorreta. Confira e tente de novo.";
  }
}

function paint(){
  let hits=0,ans=0;

    r.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===m));

    paint();
    const n=flags.size;
    if(n){$("chk").open=true;msg(`Pronto, mas confira ${n} questão(ões) com marcação dupla ou ilegível (marcadas em amarelo).`,"warn")}
    else msg("Cartão lido. Confira o resultado na foto: verde = certa, vermelho = errada.");
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){msg("Não consegui abrir a foto. Tente de novo.","bad")}
}
$("cam").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)scan(f)};
$("seq").addEventListener("input",e=>{
  const s=e.target.value.toUpperCase(),pos=e.target.selectionStart;
  mark=Array.from({length:N},(_,i)=>"ABCDE".includes(s[i]||"-")&&s[i]?s[i]:"");flags=new Set();
  paint();e.target.value=s;e.target.setSelectionRange(pos,pos);
});
$("clear").onclick=()=>{mark=Array(N).fill("");flags=new Set();last=null;bmp=null;$("prev").hidden=true;msg("");paint();$("cam").click()};
function tab(n){$("p1").hidden=n!==1;$("p2").hidden=n!==2;$("t1").setAttribute("aria-selected",n===1);$("t2").setAttribute("aria-selected",n===2)}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
</script>
</body>
</html>
